name: OfertaBot - buscas agendadas

on:
  workflow_dispatch:
  schedule:
    - cron: "3,33 * * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: read

concurrency:
  group: ofertabot-scheduled
  cancel-in-progress: false

jobs:
  buscar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar historico de ofertas
        uses: actions/cache/restore@v4
        with:
          path: enviados.db
          key: ofertabot-db-${{ github.run_id }}
          restore-keys: |
            ofertabot-db-

      - name: Instalar dependencias
        run: python -m pip install -r requirements-server.txt

      - name: Buscar e enviar ofertas uma vez
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          RUN_ONCE: "1"
          DB_FILE: enviados.db
          PYTHONUNBUFFERED: "1"
        run: python bot_ofertas_ml.py

      - name: Salvar historico de ofertas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: enviados.db
          key: ofertabot-db-${{ github.run_id }}
